services:
  - type: web
    name: bangla-ai-writer
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: MODEL_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BKASH_NUMBER
        sync: false
      - key: NAGAD_NUMBER
        sync: false
      - key: PREMIUM_PRICE
        value: "199"
      - key: PREMIUM_DAYS
        value: "30"
      - key: FREE_DAILY_LIMIT
        value: "5"
      - key: PREMIUM_DAILY_LIMIT
        value: "100"
    disk:
      name: bangla-ai-writer-data
      mountPath: /var/data
      sizeGB: 1
